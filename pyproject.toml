[project]
name = "gems-bench"
version = "0.1.0"
description = "GEMS-Bench — German Multi-hop Speech closed-world retrieval benchmark"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.11,<3.14"
dependencies = [
    "httpx>=0.27.0",
    "orjson>=3.10.0",
    "pyyaml>=6.0",
    "pandas>=2.0.0",
    "numpy>=1.26.0",
    "python-dotenv>=1.0.0",
    "tqdm>=4.68.4",
    "ipywidgets>=8.1.8",
    "websockets>=16.1",
    "sounddevice>=0.5.5",
    "matplotlib>=3.11.0",
    "tabulate>=0.10.0",
    "mlx-whisper>=0.4.3",
    "torch>=2.5.0",
    "torchaudio>=2.5.0",
    "transformers>=4.57.0,<5",
    "soundfile>=0.12",
    "safetensors>=0.4",
]

[dependency-groups]
dev = ["ipykernel>=6.29.0"]

[tool.uv]
package = false
